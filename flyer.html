<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Fitch | Printable flyer</title>
  <link rel="stylesheet" href="css/flyer.css">
  <link rel="icon" type="image/png" href="image/fitchLogo.png">
</head>
<body>
  <aside class="flyer-toolbar no-print">
    <div>
      <strong>Printable multilingual flyer</strong>
      <p>Choose the languages families at your school speak, then print or save as PDF.</p>
    </div>
    <fieldset id="flyerLangs"><legend>Languages</legend></fieldset>
    <div class="flyer-actions">
      <button id="flyerPrint" type="button">Print / Save as PDF</button>
      <span id="flyerStatus" role="status" aria-live="polite"></span>
    </div>
  </aside>

  <main id="flyerPage" class="flyer-page" aria-live="polite">
    <p class="flyer-loading">Loading…</p>
  </main>
  <script type="module" src="js/flyer.js"></script>
</body>
</html>
